<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#f5f6ff" />
  <meta name="description" content="A 100-question Computer Networks MCQ practice quiz covering all five units." />
  <title>Computer Networks — MCQ Lab</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600;700;800&family=Playfair+Display:wght@600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --ink: #20213b;
      --muted: #72758f;
      --soft: #9699ae;
      --line: rgba(97, 101, 151, .14);
      --glass: rgba(255, 255, 255, .73);
      --glass-strong: rgba(255, 255, 255, .9);
      --indigo: #5d5de5;
      --violet: #8b63dc;
      --blue: #568ce8;
      --green: #18875b;
      --green-bg: rgba(27, 165, 111, .10);
      --rose: #d34b68;
      --rose-bg: rgba(220, 75, 105, .10);
      --amber: #c0842f;
      --shadow: 0 22px 60px rgba(61, 66, 130, .10), 0 4px 15px rgba(61, 66, 130, .05);
      --radius-xl: 28px;
      --radius-lg: 21px;
      --radius-md: 15px;
      --mono: "DM Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
      --sans: "DM Sans", system-ui, sans-serif;
      --serif: "Playfair Display", Georgia, serif;
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      font-family: var(--sans);
      background:
        radial-gradient(ellipse at 7% 7%, rgba(158, 164, 255, .26), transparent 31%),
        radial-gradient(ellipse at 92% 13%, rgba(198, 169, 255, .27), transparent 29%),
        radial-gradient(ellipse at 80% 87%, rgba(154, 208, 255, .22), transparent 28%),
        linear-gradient(140deg, #f7f8ff 0%, #f5f5ff 48%, #f8faff 100%);
      background-repeat: no-repeat;
      background-size: cover;
      overflow-x: hidden;
    }
    button { font: inherit; }
    button:focus-visible, a:focus-visible { outline: 3px solid rgba(93, 93, 229, .35); outline-offset: 3px; }
    .ambient { position: fixed; pointer-events: none; z-index: 0; color: rgba(90, 91, 161, .055); font-family: var(--mono); user-select: none; }
    .ambient-one { top: 21%; right: -28px; transform: rotate(90deg); font-size: 13px; letter-spacing: .42em; }
    .ambient-two { bottom: 4%; left: -12px; font-size: 12px; line-height: 1.9; letter-spacing: .12em; }
    #app { position: relative; z-index: 1; min-height: 100vh; }
    .shell { width: min(1160px, calc(100% - 40px)); margin: 0 auto; }
    .topbar { display: flex; align-items: center; justify-content: space-between; padding: 25px 0 18px; gap: 18px; }
    .brand { display: inline-flex; align-items: center; gap: 11px; color: inherit; text-decoration: none; }
    .brand-mark { display: grid; place-items: center; width: 42px; height: 42px; border-radius: 14px; color: white; font-size: 20px; background: linear-gradient(145deg, #6469ed, #9a70dc); box-shadow: 0 8px 18px rgba(100, 105, 237, .25); }
    .brand-name { display: block; font-weight: 800; letter-spacing: -.04em; font-size: 15px; }
    .brand-sub { display: block; color: var(--muted); font-size: 11px; margin-top: 1px; }
    .top-actions { display: flex; align-items: center; gap: 10px; }
    .top-chip { display: inline-flex; gap: 7px; align-items: center; color: #626687; padding: 9px 13px; border: 1px solid var(--line); background: rgba(255,255,255,.58); backdrop-filter: blur(12px); border-radius: 999px; font-size: 12px; font-weight: 700; }
    .top-chip .dot { width: 7px; height: 7px; border-radius: 50%; background: #31ad7b; box-shadow: 0 0 0 4px rgba(49,173,123,.11); }
    .hero { padding: 49px 0 36px; animation: fadeUp .55s ease both; }
    .eyebrow { display: inline-flex; align-items: center; gap: 9px; color: var(--indigo); font-size: 11px; text-transform: uppercase; letter-spacing: .16em; font-weight: 800; }
    .eyebrow::before { content: ""; display: inline-block; width: 23px; height: 1px; background: currentColor; }
    h1, h2, h3, p { margin-top: 0; }
    .hero h1 { max-width: 800px; margin: 15px 0 13px; font-family: var(--serif); font-weight: 700; font-size: clamp(39px, 6.4vw, 69px); line-height: 1.04; letter-spacing: -.045em; }
    .gradient-text { background: linear-gradient(105deg, #555be2 8%, #8863d8 55%, #4b94d8 100%); -webkit-background-clip: text; background-clip: text; color: transparent; }
    .hero-copy { max-width: 600px; color: var(--muted); line-height: 1.7; font-size: 15px; margin-bottom: 25px; }
    .hero-meta { display: flex; flex-wrap: wrap; gap: 10px; }
    .meta-pill { display: inline-flex; align-items: center; gap: 7px; border: 1px solid var(--line); padding: 9px 13px; background: rgba(255,255,255,.55); border-radius: 999px; color: #656985; font-size: 12px; font-weight: 700; }
    .meta-pill strong { color: var(--ink); }
    .section-head { display: flex; align-items: end; justify-content: space-between; gap: 18px; margin: 18px 0 17px; }
    .section-head h2 { margin: 0 0 5px; font-size: 19px; letter-spacing: -.035em; }
    .section-head p { margin: 0; color: var(--muted); font-size: 12px; }
    .cards-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 245px), 1fr)); gap: 16px; padding-bottom: 70px; }
    .mode-card { position: relative; text-align: left; min-height: 213px; padding: 22px; border: 1px solid rgba(255,255,255,.92); border-radius: var(--radius-lg); background: var(--glass); box-shadow: 0 10px 30px rgba(76, 79, 146, .07); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); cursor: pointer; transition: transform .22s ease, box-shadow .22s ease, border-color .22s ease; overflow: hidden; color: inherit; }
    .mode-card::after { content: ""; position: absolute; width: 150px; height: 150px; right: -68px; bottom: -82px; border-radius: 50%; background: var(--orb, rgba(116,122,239,.12)); filter: blur(2px); }
    .mode-card:hover { transform: translateY(-5px); box-shadow: 0 18px 42px rgba(76, 79, 146, .13); border-color: rgba(124, 124, 235, .34); }
    .mode-card.all-card { background: linear-gradient(135deg, rgba(255,255,255,.88), rgba(238,239,255,.86)); }
    .card-top { display: flex; justify-content: space-between; align-items: flex-start; position: relative; z-index: 1; }
    .unit-icon { display: grid; place-items: center; width: 45px; height: 45px; border-radius: 15px; background: var(--icon-bg, #eeeeff); font-size: 22px; }
    .preview-mini { border: 1px solid rgba(102,105,174,.15); border-radius: 999px; background: rgba(255,255,255,.68); padding: 7px 10px; color: #696c91; font-size: 10px; font-weight: 800; cursor: pointer; transition: background .2s, color .2s; }
    .preview-mini:hover { background: white; color: var(--indigo); }
    .mode-card h3 { position: relative; z-index: 1; margin: 20px 0 5px; font-size: 17px; letter-spacing: -.035em; }
    .mode-card .topic { position: relative; z-index: 1; max-width: 260px; min-height: 35px; color: var(--muted); font-size: 12px; line-height: 1.5; }
    .card-bottom { position: relative; z-index: 1; display: flex; align-items: center; justify-content: space-between; margin-top: 15px; }
    .count { color: #6d7090; font-size: 11px; font-weight: 700; }
    .count strong { color: var(--ink); font-family: var(--mono); font-size: 14px; margin-right: 3px; }
    .arrow-circle { display: grid; place-items: center; border-radius: 50%; width: 29px; height: 29px; background: rgba(99,100,221,.09); color: var(--indigo); font-size: 16px; }
    .footer { padding: 0 0 26px; text-align: center; color: #9698ad; font-size: 11px; }
    .footer span { color: #70739a; font-weight: 700; }

    .view-enter { animation: fadeUp .34s ease both; }
    .page-heading { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin: 30px 0 20px; }
    .page-heading h1 { margin: 0 0 5px; font-family: var(--serif); font-size: clamp(27px, 4vw, 39px); letter-spacing: -.04em; }
    .page-heading p { color: var(--muted); font-size: 13px; margin: 0; }
    .btn { border: 1px solid transparent; border-radius: 13px; padding: 11px 16px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; font-size: 12px; font-weight: 800; cursor: pointer; transition: transform .18s, box-shadow .18s, background .18s; }
    .btn:hover { transform: translateY(-1px); }
    .btn-primary { background: linear-gradient(120deg, #5d62e8, #8865d9); color: white; box-shadow: 0 9px 20px rgba(95,98,224,.2); }
    .btn-primary:hover { box-shadow: 0 12px 25px rgba(95,98,224,.28); }
    .btn-soft { border-color: var(--line); background: rgba(255,255,255,.68); color: #646783; }
    .btn-soft:hover { background: white; }
    .btn-danger { background: rgba(216,73,102,.09); color: var(--rose); border-color: rgba(216,73,102,.12); }
    .btn:disabled { opacity: .4; cursor: not-allowed; transform: none; }
    .quiz-toolbar { display: flex; align-items: center; justify-content: space-between; gap: 14px; padding: 14px 17px; border: 1px solid rgba(255,255,255,.95); background: rgba(255,255,255,.66); border-radius: 17px; backdrop-filter: blur(18px); box-shadow: 0 8px 24px rgba(75,78,139,.05); }
    .toolbar-mode { display: flex; align-items: center; gap: 10px; min-width: 0; }
    .toolbar-icon { width: 37px; height: 37px; border-radius: 12px; display: grid; place-items: center; background: #eeefff; font-size: 18px; flex-shrink: 0; }
    .toolbar-label { font-size: 12px; font-weight: 800; }
    .toolbar-sub { font-size: 10px; color: var(--muted); margin-top: 2px; }
    .timer-box { display: flex; align-items: center; gap: 8px; color: #696c8d; font-size: 11px; font-weight: 800; white-space: nowrap; }
    .timer-value { font-family: var(--mono); font-size: 14px; color: var(--ink); font-weight: 500; font-variant-numeric: tabular-nums; }
    .quiz-layout { display: grid; grid-template-columns: minmax(0, 1fr) 275px; gap: 17px; align-items: start; margin: 17px 0 60px; }
    .glass-panel { border: 1px solid rgba(255,255,255,.95); border-radius: var(--radius-xl); background: var(--glass); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); box-shadow: var(--shadow); }
    .question-panel { padding: clamp(21px, 4vw, 34px); min-height: 455px; display: flex; flex-direction: column; }
    .question-meta { display: flex; justify-content: space-between; align-items: center; gap: 12px; color: var(--muted); font-size: 11px; font-weight: 800; }
    .q-number { color: var(--indigo); background: rgba(99,100,221,.09); padding: 7px 10px; border-radius: 999px; }
    .progress-wrap { height: 5px; background: rgba(111,113,166,.12); border-radius: 99px; overflow: hidden; margin: 17px 0 28px; }
    .progress-fill { height: 100%; width: 0; border-radius: inherit; background: linear-gradient(90deg, #5c62e8, #9c72df); transition: width .35s ease; }
    .question-text { font-family: var(--serif); font-size: clamp(23px, 3.5vw, 31px); line-height: 1.32; letter-spacing: -.025em; margin: 0 0 24px; max-width: 750px; }
    .option-list { display: grid; gap: 11px; margin-bottom: auto; }
    .option { display: flex; align-items: center; gap: 13px; width: 100%; border: 1px solid rgba(105,108,157,.14); background: rgba(255,255,255,.64); border-radius: 15px; color: #454761; padding: 13px 15px; text-align: left; cursor: pointer; transition: border .18s, background .18s, transform .18s, box-shadow .18s; }
    .option:hover { border-color: rgba(98,100,224,.34); transform: translateX(2px); background: rgba(255,255,255,.9); }
    .option.selected { border-color: rgba(94,96,224,.58); background: rgba(100,103,230,.08); box-shadow: inset 0 0 0 1px rgba(94,96,224,.13); color: #34365f; }
    .option-letter { display: grid; place-items: center; flex-shrink: 0; width: 30px; height: 30px; border-radius: 10px; background: rgba(114,116,165,.09); font-size: 11px; font-family: var(--mono); color: #777a99; font-weight: 500; }
    .option.selected .option-letter { background: var(--indigo); color: white; }
    .option-text { font-size: 13px; font-weight: 600; line-height: 1.5; }
    .option-check { margin-left: auto; color: var(--indigo); opacity: 0; font-size: 16px; }
    .option.selected .option-check { opacity: 1; }
    .question-controls { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-top: 25px; margin-top: 25px; border-top: 1px solid var(--line); }
    .control-right { display: flex; gap: 9px; }
    .palette-panel { padding: 21px; position: sticky; top: 16px; }
    .palette-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 6px; }
    .palette-head h3 { font-size: 13px; margin: 0; }
    .palette-count { color: var(--muted); font-family: var(--mono); font-size: 11px; }
    .palette-help { color: var(--muted); font-size: 10px; line-height: 1.5; margin-bottom: 17px; }
    .palette-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; max-height: 315px; overflow-y: auto; padding: 3px 4px 3px 2px; scrollbar-width: thin; scrollbar-color: rgba(104,108,158,.32) transparent; }
    .palette-grid::-webkit-scrollbar { width: 6px; }
    .palette-grid::-webkit-scrollbar-thumb { background: rgba(104,108,158,.28); border-radius: 99px; }
    .palette-btn { aspect-ratio: 1; border: 1px solid rgba(104,108,158,.16); border-radius: 10px; color: #777a95; background: rgba(255,255,255,.6); font: 11px var(--mono); cursor: pointer; transition: transform .16s, border .16s; }
    .palette-btn:hover { transform: scale(1.06); border-color: var(--indigo); }
    .palette-btn.answered { color: #fff; background: #7c78de; border-color: #7c78de; }
    .palette-btn.current { outline: 2px solid #4e54d8; outline-offset: 2px; color: #4e54d8; font-weight: 800; }
    .palette-btn.current.answered { color: white; outline-color: #4e54d8; }
    .palette-legend { display: flex; flex-wrap: wrap; gap: 11px; margin: 17px 0 19px; }
    .legend-item { display: inline-flex; align-items: center; gap: 5px; color: var(--muted); font-size: 9px; }
    .legend-swatch { width: 8px; height: 8px; border-radius: 3px; background: rgba(255,255,255,.9); border: 1px solid #c9cadb; }
    .legend-swatch.done { background: #7c78de; border-color: #7c78de; }
    .legend-swatch.now { background: white; border: 2px solid #4e54d8; }
    .submit-wide { width: 100%; }
    .answered-summary { color: var(--muted); text-align: center; font-size: 10px; margin: 10px 0 0; }

    .result-hero { display: grid; grid-template-columns: 210px minmax(0,1fr); align-items: center; gap: 31px; padding: 30px; margin: 22px 0 17px; }
    .score-wrap { display: grid; place-items: center; position: relative; }
    .score-ring { width: 172px; height: 172px; border-radius: 50%; display: grid; place-items: center; background: conic-gradient(var(--indigo) 0deg, #a18ae4 0deg, rgba(112,113,164,.12) 0deg); position: relative; transition: background 1s ease; }
    .score-ring::before { content: ""; position: absolute; inset: 12px; border-radius: 50%; background: #f9f9ff; box-shadow: inset 0 0 0 1px rgba(107,108,167,.10); }
    .score-center { position: relative; z-index: 1; text-align: center; }
    .score-number { font-family: var(--mono); font-size: 37px; letter-spacing: -.08em; font-weight: 500; }
    .score-caption { color: var(--muted); font-size: 10px; margin-top: 1px; }
    .result-copy .eyebrow { margin-bottom: 11px; }
    .result-copy h1 { font-family: var(--serif); letter-spacing: -.04em; font-size: clamp(29px, 4vw, 42px); line-height: 1.1; margin: 0 0 8px; }
    .result-copy p { color: var(--muted); font-size: 13px; line-height: 1.65; margin-bottom: 15px; }
    .pass-badge { display: inline-flex; align-items: center; gap: 7px; border-radius: 999px; padding: 8px 12px; font-size: 10px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; }
    .pass-badge.pass { background: var(--green-bg); color: var(--green); }
    .pass-badge.fail { background: var(--rose-bg); color: var(--rose); }
    .stats-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 11px; margin-bottom: 22px; }
    .stat-card { border: 1px solid rgba(255,255,255,.95); background: rgba(255,255,255,.67); backdrop-filter: blur(15px); border-radius: 17px; padding: 15px; box-shadow: 0 8px 23px rgba(75,78,139,.045); }
    .stat-value { font: 22px var(--mono); letter-spacing: -.07em; margin-bottom: 3px; }
    .stat-label { color: var(--muted); font-size: 10px; font-weight: 700; }
    .answer-list-head { display: flex; justify-content: space-between; align-items: end; gap: 15px; margin: 28px 0 13px; }
    .answer-list-head h2 { font-size: 18px; letter-spacing: -.03em; margin: 0 0 4px; }
    .answer-list-head p { font-size: 11px; color: var(--muted); margin: 0; }
    .result-actions { display: flex; gap: 9px; flex-wrap: wrap; }
    .answer-cards { display: grid; gap: 10px; margin-bottom: 55px; }
    .answer-card { border: 1px solid rgba(255,255,255,.96); border-radius: 17px; padding: 15px 17px; background: rgba(255,255,255,.72); box-shadow: 0 6px 18px rgba(75,78,139,.04); }
    .answer-card.correct { border-left: 4px solid #2ea77b; }
    .answer-card.wrong { border-left: 4px solid #dc607b; }
    .answer-card.skipped { border-left: 4px solid #a8aabd; }
    .answer-card-top { display: flex; justify-content: space-between; align-items: start; gap: 12px; margin-bottom: 7px; }
    .answer-q { font-size: 12px; font-weight: 800; line-height: 1.55; }
    .answer-status { flex-shrink: 0; font-size: 10px; font-weight: 800; border-radius: 99px; padding: 5px 8px; }
    .correct .answer-status { color: var(--green); background: var(--green-bg); }
    .wrong .answer-status { color: var(--rose); background: var(--rose-bg); }
    .skipped .answer-status { color: #777a90; background: rgba(120,123,149,.1); }
    .answer-detail { font-size: 11px; color: var(--muted); line-height: 1.65; }
    .answer-detail strong { color: #41435f; }

    .review-layout { display: grid; grid-template-columns: minmax(0,1fr) 275px; gap: 17px; align-items: start; margin: 18px 0 60px; }
    .review-panel { padding: clamp(21px, 4vw, 34px); }
    .filter-row { display: flex; align-items: center; gap: 7px; margin: 0 0 19px; }
    .filter-btn { padding: 8px 12px; border-radius: 999px; background: rgba(255,255,255,.58); border: 1px solid var(--line); font-size: 10px; font-weight: 800; color: var(--muted); cursor: pointer; }
    .filter-btn.active { background: rgba(99,100,221,.11); color: var(--indigo); border-color: rgba(99,100,221,.25); }
    .review-question { font-family: var(--serif); font-size: clamp(22px, 3.1vw, 29px); line-height: 1.35; margin: 0 0 21px; }
    .review-option { display: flex; align-items: flex-start; gap: 11px; padding: 12px 14px; border-radius: 13px; border: 1px solid rgba(109,112,158,.13); background: rgba(255,255,255,.56); margin-bottom: 9px; font-size: 12px; color: #5e607a; line-height: 1.5; }
    .review-option .option-letter { width: 27px; height: 27px; border-radius: 9px; }
    .review-option.correct-option { background: var(--green-bg); border-color: rgba(35,158,111,.24); color: #246b53; }
    .review-option.correct-option .option-letter { color: white; background: #2d9f79; }
    .review-option.wrong-option { background: var(--rose-bg); border-color: rgba(217,84,112,.25); color: #a14358; }
    .review-option.wrong-option .option-letter { color: white; background: #d35a75; }
    .review-note { border-radius: 12px; background: rgba(99,100,221,.07); color: #5d6091; padding: 11px 13px; font-size: 11px; font-weight: 700; margin-top: 14px; }
    .review-note.correct-note { background: var(--green-bg); color: var(--green); }
    .review-note.wrong-note { background: var(--rose-bg); color: #a14358; }
    .review-controls { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding-top: 20px; margin-top: 22px; border-top: 1px solid var(--line); }
    .review-page-count { font: 11px var(--mono); color: var(--muted); }
    .review-palette { padding: 21px; position: sticky; top: 16px; }
    .review-palette .palette-grid { grid-template-columns: repeat(5, 1fr); }
    .palette-btn.r-correct { background: #2e9e77; border-color: #2e9e77; color: white; }
    .palette-btn.r-wrong { background: #d55d77; border-color: #d55d77; color: white; }
    .palette-btn.r-skipped { background: #e8e9f0; border-color: #d6d7e2; color: #7c7f98; }
    .palette-btn.r-current { outline: 2px solid var(--indigo); outline-offset: 2px; }
    .empty-state { text-align: center; padding: 42px 20px; color: var(--muted); }
    .empty-state .empty-icon { font-size: 34px; margin-bottom: 10px; }
    .empty-state h3 { color: var(--ink); margin: 0 0 6px; font-size: 17px; }
    .empty-state p { margin: 0; font-size: 12px; line-height: 1.6; }

    .preview-toolbar { display: flex; align-items: center; justify-content: space-between; gap: 15px; padding: 15px 18px; margin: 20px 0 16px; }
    .preview-group { margin-bottom: 26px; }
    .preview-group-title { display: flex; align-items: center; gap: 9px; margin: 23px 0 12px; font-size: 14px; }
    .preview-q-card { padding: 20px; margin-bottom: 11px; }
    .preview-q-card h3 { font-size: 14px; line-height: 1.55; margin: 0 0 14px; }
    .preview-option { display: flex; gap: 10px; align-items: flex-start; padding: 9px 11px; border-radius: 10px; color: #696c83; font-size: 11px; line-height: 1.5; margin-top: 6px; background: rgba(255,255,255,.42); }
    .preview-option.is-correct { background: var(--green-bg); color: #246b53; font-weight: 700; }
    .preview-option .letter { flex-shrink: 0; font: 10px var(--mono); color: #8588a0; }
    .preview-option.is-correct .letter { color: var(--green); }

    .modal-backdrop { position: fixed; z-index: 50; inset: 0; display: grid; place-items: center; padding: 18px; background: rgba(38,39,75,.26); backdrop-filter: blur(9px); -webkit-backdrop-filter: blur(9px); animation: fadeIn .16s ease both; }

            </section>
            <section>
              <div class="section-head"><div><h2>Choose your practice mode</h2><p>Each unit has its own quiz and a read-only answer preview.</p></div><span class="count"><strong>05</strong> units detected</span></div>
              <div class="cards-grid">
                ${cards}
                <article class="mode-card all-card" role="button" tabindex="0" data-start="all" style="--icon-bg:#f0edff;--orb:rgba(127,99,221,.15)" aria-label="Start all units quiz">
                  <div class="card-top"><span class="unit-icon">✦</span><span class="preview-mini" role="button" tabindex="0" data-preview="all" aria-label="Preview all units">👁 Preview</span></div>
                  <h3>All Units</h3><div class="topic">A complete mixed practice run covering the full Computer Networks question bank.</div>
                  <div class="card-bottom"><span class="count"><strong>${count}</strong> questions · full test</span><span class="arrow-circle">→</span></div>
                </article>
              </div>
            </section>
          </main>
          <footer class="footer">Built for revision · <span>Computer Networks</span> · Five units, one question bank<br><span style="font-weight:500">Answer key prepared from standard networking concepts; the source QR lists questions and options but does not provide a keyed answer sheet.</span></footer>
        </div>`;
    }

    function makeQuestions(modeId) {
      const source = modeId === "all"
        ? UNIT_ORDER.flatMap(id => MODES[id].data.map((item, index) => ({ item, unitId: id, sourceIndex: index })))
        : MODES[modeId].data.map((item, index) => ({ item, unitId: modeId, sourceIndex: index }));
      return source.map(({ item, unitId, sourceIndex }) => {
        const options = fisherYates(item.options.map((text, originalIndex) => ({ text, originalIndex })));
        const correct = options.findIndex(option => option.originalIndex === item.correct);
        return {
          id: `${unitId}-q${sourceIndex + 1}`,
          unitId,
          unitLabel: MODES[unitId].label,
          numberInUnit: sourceIndex + 1,
          q: item.q,
          options,
          correct
        };
      });
    }
    function startQuiz(modeId) {
      if (modeId !== "all" && !MODES[modeId]) return;
      session = { modeId, questions: makeQuestions(modeId), answers: {}, index: 0, elapsed: 0, submitted: false, result: null };
      currentView = "quiz";
      startTimer();
      renderQuiz();
      window.scrollTo({ top: 0, behavior: "smooth" });
    }
    function modeName(modeId) { return modeId === "all" ? "All Units" : MODES[modeId].label; }
    function currentQuestion() { return session.questions[session.index]; }
    function answeredCount() { return Object.keys(session.answers).length; }

    function renderQuiz() {
      if (!session) return renderHome();
      currentView = "quiz";
      const q = currentQuestion();
      const total = session.questions.length;
      const progress = ((session.index + 1) / total) * 100;
      const mode = session.modeId === "all" ? { icon: "✦", topic: "All five units" } : MODES[session.modeId];
      const selected = session.answers[q.id];
      const options = q.options.map((option, index) => `
        <button class="option ${selected === index ? "selected" : ""}" data-answer="${index}" aria-pressed="${selected === index}">
          <span class="option-letter">${LETTERS[index]}</span><span class="option-text">${escapeHtml(option.text)}</span><span class="option-check">✓</span>
        </button>`).join("");
      const palette = session.questions.map((item, index) => {
        const isAnswered = Object.prototype.hasOwnProperty.call(session.answers, item.id);
        return `<button class="palette-btn ${isAnswered ? "answered" : ""} ${index === session.index ? "current" : ""}" data-jump="${index}" aria-label="Go to question ${index + 1}">${index + 1}</button>`;
      }).join("");
      app.innerHTML = `
        <div class="shell view-enter">
          <header class="topbar">
            <a class="brand" href="#home" data-home><span class="brand-mark">⌘</span><span><span class="brand-name">NETWORKS / LAB</span><span class="brand-sub">Computer Networks · MCQ practice</span></span></a>
            <div class="top-actions"><span class="top-chip"><span class="dot"></span> Quiz in progress</span><button class="btn btn-danger" data-exit>↗ Exit quiz</button></div>
          </header>
          <div class="quiz-toolbar">
            <div class="toolbar-mode"><span class="toolbar-icon">${mode.icon}</span><span><span class="toolbar-label">${modeName(session.modeId)}</span><span class="toolbar-sub">${escapeHtml(mode.topic)}</span></span></div>
            <div class="timer-box">◷ <span>TIME</span><span class="timer-value" id="timer-value">${formatTime(session.elapsed)}</span></div>
          </div>
          <main class="quiz-layout">
            <section class="glass-panel question-panel">
              <div class="question-meta"><span class="q-number">QUESTION ${session.index + 1} / ${total}</span><span>${q.unitLabel} · Q${q.numberInUnit}</span></div>
              <div class="progress-wrap"><div class="progress-fill" style="width:${progress}%"></div></div>
              <h1 class="question-text">${escapeHtml(q.q)}</h1>
              <div class="option-list">${options}</div>
              <div class="question-controls">
                <button class="btn btn-soft" data-prev ${session.index === 0 ? "disabled" : ""}>← Previous</button>
                <div class="control-right">
                  ${session.index === total - 1
                    ? `<button class="btn btn-primary" data-submit>Finish quiz ✓</button>`
                    : `<button class="btn btn-primary" data-next>Next question →</button>`}
                </div>
              </div>
            </section>
            <aside class="glass-panel palette-panel">
              <div class="palette-head"><h3>Question palette</h3><span class="palette-count">${answeredCount()}/${total}</span></div>
              <div class="palette-help">Jump to any question. Your selected answers are saved as you move.</div>
              <div class="palette-grid">${palette}</div>
              <div class="palette-legend"><span class="legend-item"><i class="legend-swatch done"></i> Answered</span><span class="legend-item"><i class="legend-swatch"></i> Not answered</span><span class="legend-item"><i class="legend-swatch now"></i> Current</span></div>
              <button class="btn btn-primary submit-wide" data-submit>Submit quiz →</button>
              <p class="answered-summary">${total - answeredCount()} unanswered question${total - answeredCount() === 1 ? "" : "s"} remaining</p>
            </aside>
          </main>
        </div>`;
    }

    function calculateResult() {
      const total = session.questions.length;
      let correct = 0, wrong = 0, skipped = 0;
      session.questions.forEach(q => {
        if (!Object.prototype.hasOwnProperty.call(session.answers, q.id)) skipped++;
        else if (session.answers[q.id] === q.correct) correct++;
        else wrong++;
      });
      return { total, correct, wrong, skipped, percent: Math.round((correct / total) * 100), elapsed: session.elapsed };
    }
    async function requestSubmit() {
      if (!session || session.submitted) return;
      const skipped = session.questions.length - answeredCount();
      const message = skipped
        ? `You have ${skipped} unanswered question${skipped === 1 ? "" : "s"}. They will be counted as skipped, not wrong. Submit your quiz now?`
        : "You have answered every question. Submit your quiz and see your results?";
      const ok = await confirmDialog({ icon: "✓", title: "Submit your quiz?", message, confirmText: "Submit quiz", cancelText: "Keep reviewing" });
      if (!ok) return;
      session.submitted = true;
      session.result = calculateResult();
      clearTimer();
      renderResults();
      window.scrollTo({ top: 0, behavior: "smooth" });
    }
    function resultStatus(q) {
      if (!Object.prototype.hasOwnProperty.call(session.answers, q.id)) return "skipped";
      return session.answers[q.id] === q.correct ? "correct" : "wrong";
    }
    function answerSummaryCard(q, index) {
      const status = resultStatus(q);
      const selected = session.answers[q.id];
      const correctText = q.options[q.correct].text;
      let detail = "";
      if (status === "correct") detail = `<div class="answer-detail">Correct! <strong>Option ${LETTERS[q.correct]} — ${escapeHtml(correctText)}</strong></div>`;
      if (status === "wrong") detail = `<div class="answer-detail">Your answer: <strong>Option ${LETTERS[selected]} — ${escapeHtml(q.options[selected].text)}</strong><br>Correct answer: <strong>Option ${LETTERS[q.correct]} — ${escapeHtml(correctText)}</strong></div>`;
      if (status === "skipped") detail = `<div class="answer-detail">Not answered.<br>Correct answer: <strong>Option ${LETTERS[q.correct]} — ${escapeHtml(correctText)}</strong></div>`;
      const symbol = status === "correct" ? "✓ Correct" : status === "wrong" ? "✕ Wrong" : "○ Skipped";
      return `<article class="answer-card ${status}"><div class="answer-card-top"><div class="answer-q">Q${index + 1}. ${escapeHtml(q.q)}</div><span class="answer-status">${symbol}</span></div>${detail}</article>`;
    }
    function renderResults() {
      currentView = "results";
      const r = session.result;
      const ringDeg = Math.round(r.percent * 3.6);
      const isPass = r.percent >= 50;
      const modeLabel = modeName(session.modeId);
      const answers = session.questions.map(answerSummaryCard).join("");
      app.innerHTML = `
        <div class="shell view-enter">
          <header class="topbar"><a class="brand" href="#home" data-home><span class="brand-mark">⌘</span><span><span class="brand-name">NETWORKS / LAB</span><span class="brand-sub">Computer Networks · Results</span></span></a><button class="btn btn-soft" data-home>⌂ Home</button></header>
          <main>
            <section class="glass-panel result-hero">
              <div class="score-wrap"><div class="score-ring" id="score-ring"><div class="score-center"><div class="score-number">${r.percent}%</div><div class="score-caption">YOUR SCORE</div></div></div></div>
              <div class="result-copy"><div class="eyebrow">${escapeHtml(modeLabel)} · Complete</div><h1>${isPass ? "Nicely done." : "Keep building."}</h1><p>${isPass ? "You reached the 50% pass mark. Review the explanations and reinforce the topics you missed." : "You are below the 50% pass mark this time. Review the correct answers and give the quiz another try."} Your result is broken down below.</p><span class="pass-badge ${isPass ? "pass" : "fail"}">${isPass ? "✓ Pass · 50% or above" : "✕ Not passed · Below 50%"}</span></div>
            </section>
            <section class="stats-grid">
              <div class="stat-card"><div class="stat-value">${r.correct}</div><div class="stat-label">Correct</div></div>
              <div class="stat-card"><div class="stat-value">${r.wrong}</div><div class="stat-label">Wrong</div></div>
              <div class="stat-card"><div class="stat-value">${r.skipped}</div><div class="stat-label">Skipped</div></div>
              <div class="stat-card"><div class="stat-value">${r.total}</div><div class="stat-label">Total</div></div>
              <div class="stat-card"><div class="stat-value">${formatTime(r.elapsed)}</div><div class="stat-label">Time taken</div></div>
            </section>
            <div class="answer-list-head"><div><h2>Your answers</h2><p>Every question is listed below, including skipped questions.</p></div><div class="result-actions"><button class="btn btn-soft" data-review="all">Open full review</button><button class="btn btn-soft" data-review="wrong">Review wrong only</button><button class="btn btn-primary" data-restart>↻ Restart quiz</button></div></div>
            <section class="answer-cards">${answers}</section>
          </main>
        </div>`;
      requestAnimationFrame(() => {
        const ring = document.getElementById("score-ring");
        if (ring) ring.style.background = `conic-gradient(var(--indigo) 0deg, #a18ae4 ${ringDeg}deg, rgba(112,113,164,.12) ${ringDeg}deg)`;
      });
    }

    function getReviewQuestions() {
      const all = session.questions.map((q, index) => ({ q, index, status: resultStatus(q) }));
      return reviewFilter === "wrong" ? all.filter(item => item.status === "wrong") : all;
    }
    function renderReview() {
      currentView = "review";
      const reviewItems = getReviewQuestions();
      const current = reviewItems[reviewIndex];
      const r = session.result;
      const palette = session.questions.map((q, i) => {
        const status = resultStatus(q);
        const isCurrent = current && current.index === i;
        return `<button class="palette-btn ${status === "correct" ? "r-correct" : status === "wrong" ? "r-wrong" : "r-skipped"} ${isCurrent ? "r-current" : ""}" data-review-jump="${i}" aria-label="Review question ${i + 1}">${i + 1}</button>`;
      }).join("");
      let body = "";
      if (!current) {
        body = `<div class="empty-state"><div class="empty-icon">🎉</div><h3>No wrong answers</h3><p>There are no incorrect answers in this attempt. Switch to All to review every question.</p></div>`;
      } else {
        const q = current.q;
        const selected = session.answers[q.id];
        const options = q.options.map((option, index) => {
          let cls = "";
          if (index === q.correct) cls = "correct-option";
          else if (selected === index && current.status === "wrong") cls = "wrong-option";
          const hint = index === q.correct ? " ✓" : selected === index && current.status === "wrong" ? " ✕ Your answer" : "";
          return `<div class="review-option ${cls}"><span class="option-letter">${LETTERS[index]}</span><span>${escapeHtml(option.text)}${hint}</span></div>`;
        }).join("");
        const note = current.status === "correct"
          ? `<div class="review-note correct-note">✓ Correct answer: Option ${LETTERS[q.correct]}</div>`
          : current.status === "wrong"
            ? `<div class="review-note wrong-note">✕ Your answer: Option ${LETTERS[selected]} · Correct answer: Option ${LETTERS[q.correct]}</div>`
            : `<div class="review-note">○ Skipped · Correct answer: Option ${LETTERS[q.correct]}</div>`;
        body = `<div class="question-meta"><span class="q-number">${current.status.toUpperCase()}</span><span>${q.unitLabel} · Q${q.numberInUnit}</span></div><h2 class="review-question">${escapeHtml(q.q)}</h2>${options}${note}`;
      }
      const currentIndex = current ? current.index : -1;
      app.innerHTML = `
        <div class="shell view-enter">
          <header class="topbar"><a class="brand" href="#home" data-home><span class="brand-mark">⌘</span><span><span class="brand-name">NETWORKS / LAB</span><span class="brand-sub">Computer Networks · Review</span></span></a><button class="btn btn-soft" data-results>← Results</button></header>
          <div class="page-heading"><div><div class="eyebrow">Answer analysis</div><h1>Full review</h1><p>Inspect the selected option and the correct answer for each question.</p></div><button class="btn btn-primary" data-restart>↻ Restart quiz</button></div>
          <main class="review-layout">
            <section class="glass-panel review-panel">
              <div class="filter-row"><button class="filter-btn ${reviewFilter === "all" ? "active" : ""}" data-filter="all">All questions (${r.total})</button><button class="filter-btn ${reviewFilter === "wrong" ? "active" : ""}" data-filter="wrong">Wrong only (${r.wrong})</button></div>
              ${body}
              ${current ? `<div class="review-controls"><button class="btn btn-soft" data-review-prev ${reviewIndex === 0 ? "disabled" : ""}>← Previous</button><span class="review-page-count">${reviewIndex + 1} / ${reviewItems.length}</span><button class="btn btn-primary" data-review-next ${reviewIndex >= reviewItems.length - 1 ? "disabled" : ""}>Next →</button></div>` : `<div class="review-controls"><button class="btn btn-soft" data-results>← Back to results</button><button class="btn btn-primary" data-filter="all">Review all →</button></div>`}
            </section>
            <aside class="glass-panel review-palette"><div class="palette-head"><h3>Jump to question</h3><span class="palette-count">${r.total} total</span></div><div class="palette-help">Green = correct · Rose = wrong · Grey = skipped. Tap any number to jump.</div><div class="palette-grid">${palette}</div><div class="palette-legend"><span class="legend-item"><i class="legend-swatch" style="background:#2e9e77;border-color:#2e9e77"></i> Correct</span><span class="legend-item"><i class="legend-swatch" style="background:#d55d77;border-color:#d55d77"></i> Wrong</span><span class="legend-item"><i class="legend-swatch" style="background:#e8e9f0"></i> Skipped</span></div></aside>
          </main>
        </div>`;
    }

    function renderPreview(modeId) {
      currentView = "preview";
      const selectedUnits = modeId === "all" ? UNIT_ORDER : [modeId];
      const count = selectedUnits.reduce((sum, id) => sum + MODES[id].data.length, 0);
      const groups = selectedUnits.map(id => {
        const mode = MODES[id];
        const items = mode.data.map((q, index) => `
          <article class="glass-panel preview-q-card">
            <h3><span class="q-number">Q${index + 1}</span> &nbsp;${escapeHtml(q.q)}</h3>
            ${q.options.map((option, optionIndex) => `<div class="preview-option ${optionIndex === q.correct ? "is-correct" : ""}"><span class="letter">${LETTERS[optionIndex]}.</span><span>${escapeHtml(option)}${optionIndex === q.correct ? " &nbsp;✓ Correct answer" : ""}</span></div>`).join("")}
          </article>`).join("");
        return `<section class="preview-group"><h2 class="preview-group-title"><span class="unit-icon" style="width:34px;height:34px;font-size:16px;background:${mode.tint}">${mode.icon}</span>${mode.label} — ${escapeHtml(mode.topic)} <span class="count">(${mode.data.length})</span></h2>${items}</section>`;
      }).join("");
      app.innerHTML = `
        <div class="shell view-enter">
          <header class="topbar"><a class="brand" href="#home" data-home><span class="brand-mark">⌘</span><span><span class="brand-name">NETWORKS / LAB</span><span class="brand-sub">Computer Networks · Preview</span></span></a><button class="btn btn-soft" data-home>⌂ Home</button></header>
          <div class="page-heading"><div><div class="eyebrow">Reading mode · Answer key</div><h1>${modeId === "all" ? "All unit previews" : `${MODES[modeId].label} preview`}</h1><p>Read-only practice sheet. Correct options are highlighted in green.</p></div><button class="btn btn-primary" data-start="${modeId}">Start this quiz →</button></div>
          <div class="glass-panel preview-toolbar"><div><strong style="font-size:13px">${count} questions</strong><div class="toolbar-sub">Answers are shown · No timer or scoring</div></div><button class="btn btn-soft" data-home>← Back to home</button></div>
          <main>${groups}</main>
          <footer class="footer">End of preview · <span>Computer Networks</span></footer>
        </div>`;
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function confirmDialog({ icon = "?", title = "Are you sure?", message = "", confirmText = "Confirm", cancelText = "Cancel", danger = false }) {
      return new Promise(resolve => {
        modalRoot.innerHTML = `
          <div class="modal-backdrop" data-modal-backdrop>
            <section class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modal-title" aria-describedby="modal-message">
              <div class="modal-icon">${icon}</div><h3 id="modal-title">${escapeHtml(title)}</h3><p id="modal-message">${escapeHtml(message)}</p>
              <div class="modal-actions"><button class="btn btn-soft" data-modal-cancel>${escapeHtml(cancelText)}</button><button class="btn ${danger ? "btn-danger" : "btn-primary"}" data-modal-confirm>${escapeHtml(confirmText)}</button></div>
            </section>
          </div>`;
        const backdrop = modalRoot.querySelector("[data-modal-backdrop]");
        const cancel = modalRoot.querySelector("[data-modal-cancel]");
        const confirm = modalRoot.querySelector("[data-modal-confirm]");
        let settled = false;
        const finish = value => {
          if (settled) return;
          settled = true;
          document.removeEventListener("keydown", onKey);
          modalRoot.innerHTML = "";
          resolve(value);
        };
        const onKey = event => { if (event.key === "Escape") finish(false); };
        document.addEventListener("keydown", onKey);
        cancel.addEventListener("click", () => finish(false));
        confirm.addEventListener("click", () => finish(true));
        backdrop.addEventListener("click", event => { if (event.target === backdrop) finish(false); });
        confirm.focus();
      });
    }
    async function exitQuiz() {
      const ok = await confirmDialog({ icon: "↗", title: "Exit this quiz?", message: "Your current attempt and answers will be discarded. Return to the home page?", confirmText: "Exit quiz", cancelText: "Stay here", danger: true });
      if (ok) { session = null; renderHome(); window.scrollTo({ top: 0, behavior: "smooth" }); }
    }
    async function restartQuiz() {
      const ok = await confirmDialog({ icon: "↻", title: "Restart this quiz?", message: "Your current result and answers will be cleared. Options will be shuffled again for the new attempt.", confirmText: "Restart", cancelText: "Cancel" });
      if (ok) startQuiz(session.modeId);
    }
    function showResults() { renderResults(); window.scrollTo({ top: 0, behavior: "smooth" }); }

    // One delegated event handler keeps dynamically rendered controls simple.
    app.addEventListener("click", async event => {
      const preview = event.target.closest("[data-preview]");
      if (preview) { event.stopPropagation(); renderPreview(preview.dataset.preview); return; }
      const start = event.target.closest("[data-start]");
      if (start) { startQuiz(start.dataset.start); return; }
      if (event.target.closest("[data-home]")) { if (session && !session.submitted && currentView === "quiz") { await exitQuiz(); } else { session = null; renderHome(); } return; }
      const answer = event.target.closest("[data-answer]");
      if (answer && currentView === "quiz") {
        session.answers[currentQuestion().id] = Number(answer.dataset.answer);
        renderQuiz();
        return;
      }
      const jump = event.target.closest("[data-jump]");
      if (jump && currentView === "quiz") { session.index = Number(jump.dataset.jump); renderQuiz(); return; }
      if (event.target.closest("[data-prev]") && currentView === "quiz") { if (session.index > 0) { session.index--; renderQuiz(); } return; }
      if (event.target.closest("[data-next]") && currentView === "quiz") { if (session.index < session.questions.length - 1) { session.index++; renderQuiz(); } return; }
      if (event.target.closest("[data-submit]") && currentView === "quiz") { await requestSubmit(); return; }
      if (event.target.closest("[data-exit]")) { await exitQuiz(); return; }
      if (event.target.closest("[data-restart]")) { await restartQuiz(); return; }
      const review = event.target.closest("[data-review]");
      if (review) { reviewFilter = review.dataset.review; reviewIndex = 0; renderReview(); window.scrollTo({ top: 0, behavior: "smooth" }); return; }
      if (event.target.closest("[data-results]")) { showResults(); return; }
      const filter = event.target.closest("[data-filter]");
      if (filter) { reviewFilter = filter.dataset.filter; reviewIndex = 0; renderReview(); return; }
      const reviewJump = event.target.closest("[data-review-jump]");
      if (reviewJump) {
        const targetIndex = Number(reviewJump.dataset.reviewJump);
        const targetStatus = resultStatus(session.questions[targetIndex]);
        if (reviewFilter === "wrong" && targetStatus !== "wrong") reviewFilter = "all";
        const list = getReviewQuestions();
        reviewIndex = Math.max(0, list.findIndex(item => item.index === targetIndex));
        renderReview(); return;
      }
      if (event.target.closest("[data-review-prev]")) { if (reviewIndex > 0) { reviewIndex--; renderReview(); } return; }
      if (event.target.closest("[data-review-next]")) { const list = getReviewQuestions(); if (reviewIndex < list.length - 1) { reviewIndex++; renderReview(); } return; }
    });

    // Preview buttons nested in the cards also support keyboard activation.
    app.addEventListener("keydown", event => {
      if (event.key !== "Enter" && event.key !== " ") return;
      const preview = event.target.closest("[data-preview]");
      if (preview) {
        event.preventDefault();
        renderPreview(preview.dataset.preview);
        return;
      }
      const card = event.target.closest("[data-start]");
      if (card) {
        event.preventDefault();
        startQuiz(card.dataset.start);
      }
    });

    // The source arrays above contain 20 items per unit (100 in total).
    renderHome();
  </script>
</body>
</html>
